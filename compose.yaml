services:
  mariadb:
    image: 'mariadb:12.3.3-ubi'
    ports:
      - '3306:3306'
    environment:
      MARIADB_DATABASE: tasktracker
      MARIADB_PASSWORD: indev
      MARIADB_ROOT_PASSWORD: indev
      MARIADB_USER: indev
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uindev -pindev"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  kafka-1:
    image: apache/kafka:4.3.1
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: '0zqAMLRZRRa7WEZhgSnPKQ'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9090, EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mariadb:
        condition: service_healthy
  kafka-2:
    image: apache/kafka:4.3.1
    ports:
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_CLUSTER_ID: '0zqAMLRZRRa7WEZhgSnPKQ'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9090, EXTERNAL://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9094 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mariadb:
        condition: service_healthy
  kafka-3:
    image: apache/kafka:4.3.1
    ports:
      - '9096:9096'
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_CLUSTER_ID: '0zqAMLRZRRa7WEZhgSnPKQ'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9096'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9090, EXTERNAL://localhost:9096'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9096 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3: