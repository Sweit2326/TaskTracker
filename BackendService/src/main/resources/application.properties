spring.application.name=BackendService

spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${API_DB_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USER}

spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics

logging.level.org.apache.kafka.clients.NetworkClient=ERROR

jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration=300m

# TODO: move kafka admin configuration into consumer service
spring.kafka.consumer.properties.allow.auto.create.topics=false

spring.kafka.admin.properties.reconnect.backoff.ms=100
spring.kafka.admin.properties.reconnect.backoff.max.ms=300
spring.kafka.admin.properties.retry.backoff.ms=50
spring.kafka.admin.properties.request.timeout.ms=100
spring.kafka.admin.properties.default.api.timeout.ms=300
spring.kafka.admin.fail-fast=false