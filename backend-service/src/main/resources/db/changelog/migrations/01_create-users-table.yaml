databaseChangeLog:
  - changeSet:
      id: 1
      author: Sweit2326
      changes:
        - createTable:
            tableName: Users
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(255) CHARACTER SET utf8mb4 COLLATE utf8mb4_bin
                  constraints:
                    nullable: false